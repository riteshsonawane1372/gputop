name: Main release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: main-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test -count=1 ./...
      - name: Build release archives
        env:
          VERSION: main-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist/stage
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os=${target%/*}
            arch=${target#*/}
            archive="gputop_${VERSION}_${os}_${arch}"
            stage="dist/stage/${archive}"
            mkdir -p "$stage"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/gputop/gputop/internal/buildinfo.Version=${VERSION} -X github.com/gputop/gputop/internal/buildinfo.Commit=${GITHUB_SHA}" \
              -o "$stage/gputop" ./cmd/gputop
            cp LICENSE README.md CHANGELOG.md "$stage/"
            tar -C dist/stage -czf "dist/${archive}.tar.gz" "$archive"
          done
          shasum -a 256 dist/*.tar.gz > dist/checksums.txt
      - name: Publish latest main build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f main-build "$GITHUB_SHA"
          git push --force origin refs/tags/main-build
          gh release view main-build >/dev/null 2>&1 || \
            gh release create main-build --title "Latest main build" --prerelease --notes "Automated packages from the latest commit on main."
          gh release edit main-build --title "Latest main build" --prerelease \
            --notes "Automated packages from ${GITHUB_SHA}."
          gh release upload main-build dist/*.tar.gz dist/checksums.txt --clobber
