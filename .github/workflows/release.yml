name: Release

# Stable releases. Either push a semantic tag (git tag v0.1.0 && git push
# origin v0.1.0), or run this workflow from the Actions tab on main and pick
# which version component to bump from the latest stable release.
# Tags with a prerelease suffix (v0.1.0-rc.1) are published as prereleases.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: Version component to increment
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test before releasing
        run: go test -count=1 ./...
      - name: Resolve version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            tag=$(scripts/version.sh stable "$BUMP")
            git tag "$tag" "$GITHUB_SHA"
            git push origin "refs/tags/$tag"
          else
            tag=$GITHUB_REF_NAME
          fi
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$tag is not a semantic version tag (vMAJOR.MINOR.PATCH[-PRERELEASE])"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "previous=$(scripts/version.sh previous "$tag")" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.tag }}
          GORELEASER_PREVIOUS_TAG: ${{ steps.version.outputs.previous }}
